<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte à rebours - Nahuel & Mathis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #f5f1e6 url('demande.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #d4af37;
        }
        h1 {
            font-size: 2.5em;
            margin: 20px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
        }
        .countdown {
            font-size: 4em;
            font-weight: bold;
            animation: pulse 2s infinite;
            margin-top: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <h1>Plus que <span class="countdown" id="days"></span> jours,<br>avant que Nahuel et Mathis se disent Oui 💍</h1>
    <audio id="bg-music" loop autoplay>
        <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Arnaud_Cond/Soft_Piano_Melody/Arnaud_Cond_-_Soft_Piano_Melody.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas l'audio.
    </audio>
    <button class="audio-control" onclick="toggleMusic()">🔊</button>

    <script>
        function updateCountdown() {
            const weddingDate = new Date("2026-05-02T00:00:00");
            const now = new Date();
            const diffTime = weddingDate - now;
            const daysLeft = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
            document.getElementById('days').textContent = daysLeft;
        }
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 86400000); // update once a day
    </script>
</body>
</html>
